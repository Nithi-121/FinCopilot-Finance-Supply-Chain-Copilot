[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fincopilot"
version = "0.1.0"
description = "Evidence-grounded SEC filings assistant with measurable retrieval and tool-backed finance answers"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12", "requests>=2.31", "numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8",
  "duckdb>=1.0", "chromadb>=0.5", "sentence-transformers>=3.0",
  "rank-bm25>=0.2.2", "fastapi>=0.110", "uvicorn[standard]>=0.27",
  "streamlit>=1.33", "ollama>=0.2", "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
